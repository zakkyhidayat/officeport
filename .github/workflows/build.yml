name: Build APK

# Builds Officeport from a GenOffice release: by hand (any version), when a
# v* tag is pushed, and once a day when GenOffice has published a release
# this repository has not built yet.
on:
  workflow_dispatch:
    inputs:
      version:
        description: GenOffice version (e.g. 0.12.29); empty for the latest
        required: false
      release:
        description: Upload the APKs to the release (replacing its files)
        type: boolean
        default: false
  push:
    tags: ['v*']
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Pick the GenOffice version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT: ${{ inputs.version }}
        run: |
          if [[ -n "$INPUT" ]]; then v=$INPUT
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then v=${GITHUB_REF#refs/tags/v}; v=${v%-f*}
          else v=$(gh release view -R genspark-ai/genoffice --json tagName -q .tagName | sed 's/^v//')
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # this fork's builds of GenOffice $v are released as v$v-f1, v$v-f2, ...:
          # the next one takes the next number
          last=$(gh release list -R "$GITHUB_REPOSITORY" --limit 200 --json tagName -q '.[].tagName' |
            sed -n "s/^v${v//./\\.}-f\([0-9]*\)$/\1/p" | sort -n | tail -1)
          fork=$(( ${last:-0} + 1 ))
          echo "fork=$fork" >> "$GITHUB_OUTPUT"
          echo "app=$v-f$fork" >> "$GITHUB_OUTPUT"
          # the daily run stops when this GenOffice version is already released here
          if [[ "$GITHUB_EVENT_NAME" == schedule && -n "$last" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tools
        if: steps.version.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zip
          rustup target add aarch64-linux-android x86_64-linux-android
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-java@v4
        if: steps.version.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/cache@v4
        if: steps.version.outputs.skip != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cache/officeport-termux
          key: deps-${{ steps.version.outputs.version }}-${{ hashFiles('scripts/fetch-node.py') }}
          restore-keys: deps-

      - name: Signing key
        if: steps.version.outputs.skip != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE_BASE64 secret: signing with a throwaway key, so this APK will not update an installed one."
          fi

      - name: Build
        if: steps.version.outputs.skip != 'true'
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          JOBS: 4
          FORK: ${{ steps.version.outputs.fork }}
          UPDATE_REPO: ${{ github.repository }}
        run: scripts/build-apk.sh "${{ steps.version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        if: steps.version.outputs.skip != 'true'
        # the APKs also go to the release below: a full artifact quota must not stop it
        continue-on-error: true
        with:
          name: officeport-${{ steps.version.outputs.app }}
          path: dist/*.apk
          compression-level: 0

      - name: Release
        if: steps.version.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${{ steps.version.outputs.version }}
          app=${{ steps.version.outputs.app }}
          gh release create "v$app" dist/*.apk --target "$GITHUB_SHA" --title "Officeport $app" \
            --notes "Officeport $app: GenOffice $v for Android desktops (Googlebook, Samsung DeX), fork build ${{ steps.version.outputs.fork }}. Unofficial fork built on GenOffice's codebase; not affiliated with Genspark. Install the APK for your device: arm64-v8a (most devices) or x86_64; universal has both."
